<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIRITO PLAYER</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at center, #102b50, #050914 75%);
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.login {
  width: 100%;
  max-width: 430px;
  padding: 35px;
  background: rgba(5, 12, 27, 0.95);
  border: 1px solid #087cff;
  border-radius: 18px;
  box-shadow: 0 0 30px #0066ff55;
  text-align: center;
}

.logo {
  font-size: 34px;
  font-weight: bold;
  color: #35aaff;
  text-shadow: 0 0 15px #087cff;
  margin-bottom: 8px;
}

.subtitle {
  color: #a9c9e9;
  margin-bottom: 28px;
  letter-spacing: 3px;
}

input {
  width: 100%;
  padding: 16px;
  margin: 9px 0;
  border: 1px solid #174d83;
  border-radius: 8px;
  background: #09172b;
  color: white;
  font-size: 17px;
  outline: none;
}

input:focus {
  border-color: #20a5ff;
  box-shadow: 0 0 10px #087cff;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 18px;
  border: none;
  border-radius: 8px;
  background: linear-gradient(90deg, #0066ff, #00b7ff);
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

button:focus {
  outline: 3px solid white;
  box-shadow: 0 0 20px #00aaff;
}

#status {
  color: #80caff;
  font-size: 14px;
  margin-top: 18px;
}

.footer {
  color: #52799e;
  font-size: 12px;
  margin-top: 25px;
}
</style>
</head>

<body>
<div class="login">

  <div class="logo">⚔ KIRITO PLAYER</div>
  <div class="subtitle">ENTERTAINMENT SYSTEM</div>

  <form id="loginForm">
    <input
      id="server"
      type="text"
      placeholder="DNS / Servidor"
      autocomplete="url"
      required
    >

    <input
      id="username"
      type="text"
      placeholder="Usuário"
      autocomplete="username"
      required
    >

    <input
      id="password"
      type="password"
      placeholder="Senha"
      autocomplete="current-password"
      required
    >

    <button type="submit">ENTRAR</button>
  </form>

  <div id="status">Conecte-se para continuar</div>

  <div class="footer">
    KIRITO PLAYER © 2026
  </div>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(event) {
  event.preventDefault();

  document.getElementById("status").textContent =
    "Tela pronta. A conexão com o servidor será configurada na próxima etapa.";
});
</script>

</body>
</html>
